<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-node{0%{r:6px;opacity:.7}50%{r:10px;opacity:1;filter:drop-shadow(0 0 6px #38bdf8)}}@keyframes float-card{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.stat-label,.stat-val,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.stat-label{font-weight:500;font-size:12px;fill:#64748b}.stat-val{font-weight:700;font-size:16px;fill:#38bdf8}.node-anim{animation:pulse-node 3s infinite ease-in-out}.node-delay-1{animation-delay:.7s}.node-delay-2{animation-delay:1.4s}.node-delay-3{animation-delay:2.1s}.flow-line{stroke-dasharray:8 8;animation:dash-flow 1.5s linear infinite}.floating{animation:float-card 5s ease-in-out infinite}<