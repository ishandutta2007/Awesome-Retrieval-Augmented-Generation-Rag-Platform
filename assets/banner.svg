<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .stat-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    .stat-val { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #38bdf8; }

    /* Keyframe Animations */
    @keyframes pulse-node {
      0%, 100% { r: 6px; opacity: 0.7; }
      50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes float-card {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .node-anim { animation: pulse-node 3s infinite ease-in-out; }
    .node-delay-1 { animation-delay: 0.7s; }
    .node-delay-2 { animation-delay: 1.4s; }
    .node-delay-3 { animation-delay: 2.1s; }
    .flow-line { stroke-dasharray: 8 8; animation: dash-flow 1.5s linear infinite; }
    .floating { animation: float-card 5s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Vector Graph & Pipeline Network (Right Background) -->
  <g transform="translate(680, 40)">
    <!-- Connection Lines -->
    <path d="M 50 140 Q 150 40 260 90 T 420 180" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M 50 140 Q 180 240 310 160 T 450 80" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M 120 70 L 260 90 L 310 160 L 420 180" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line"/>

    <!-- Animated Nodes -->
    <circle cx="50" cy="140" r="6" fill="#38bdf8" class="node-anim"/>
    <circle cx="120" cy="70" r="7" fill="#818cf8" class="node-anim node-delay-1"/>
    <circle cx="260" cy="90" r="8" fill="#a855f7" class="node-anim node-delay-2"/>
    <circle cx="310" cy="160" r="6" fill="#ec4899" class="node-anim node-delay-3"/>
    <circle cx="420" cy="180" r="9" fill="#38bdf8" class="node-anim node-delay-1"/>
    <circle cx="450" cy="80" r="7" fill="#a855f7" class="node-anim node-delay-2"/>
  </g>

  <!-- Foreground Title Card Overlay for Crystal Clear Legibility -->
  <rect x="50" y="45" width="620" height="270" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" class="floating"/>

  <!-- Glowing Accent Line -->
  <rect x="50" y="45" width="620" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Foreground Text Content -->
  <g transform="translate(80, 95)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="19" text-anchor="middle" class="badge-text" fill="#a5b4fc">⚡ RAG PLATFORMS 2026</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">Awesome RAG Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle">Vector Search • Ingestion • Self-Hosted Pipelines</text>

    <!-- Feature Tags Grid -->
    <g transform="translate(0, 140)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="18" class="stat-label">SaaS Platforms</text>
      <text x="15" y="34" class="stat-val">Pinecone &amp; Bedrock</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="160" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="190" y="18" class="stat-label">Open Source</text>
      <text x="190" y="34" class="stat-val">Dify, LangFlow &amp; RAGFlow</text>

      <!-- Tag 3 -->
      <rect x="350" y="0" width="170" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="365" y="18" class="stat-label">Vector Databases</text>
      <text x="365" y="34" class="stat-val">Qdrant, Weaviate &amp; Milvus</text>
    </g>
  </g>
</svg>
